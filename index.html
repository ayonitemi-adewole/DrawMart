<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home-screen icons: iPhone uses the touch icon, Android the manifest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="DrawMart" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#053B25" />
    <title>DrawMart: win it for the price of a ticket</title>
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        var t = localStorage.getItem("drawmart:theme");
        if (
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        )
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Linked here, not imported from main.tsx, so the splash below is styled from the first paint. -->
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <!--
      Loading screen. Shows from the first paint on every full page load; the app
      hides it once it's ready and shows it again after signing in (src/lib/splash.ts).
    -->
    <div
      id="splash"
      role="status"
      aria-label="Loading DrawMart"
      class="fixed inset-0 z-100 flex flex-col items-center justify-center gap-5 bg-ground transition-[opacity,visibility] duration-300 data-hidden:invisible data-hidden:opacity-0"
    >
      <span
        class="relative flex size-20 -rotate-6 items-center justify-center overflow-hidden rounded-3xl bg-linear-to-br from-brand to-hero text-ticket shadow-glow motion-safe:animate-float"
      >
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M2 3h2a1 1 0 0 1 1 1v2" />
          <path
            d="M5 6h15a1 1 0 0 1 1 1v1.75a1.75 1.75 0 0 0 0 3.5V14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-1.75a1.75 1.75 0 0 0 0-3.5z"
          />
          <path d="M15 8.2v.8M15 11.6v.8" />
          <circle cx="8.5" cy="19" r="1.75" />
          <circle cx="17.5" cy="19" r="1.75" />
        </svg>
        <span
          class="absolute inset-y-0 left-0 w-1/2 -skew-x-12 bg-on-hero/20 opacity-0 motion-safe:animate-shine motion-safe:opacity-100"
        ></span>
      </span>
      <span class="font-display text-3xl font-extrabold tracking-tight text-ink"
        >Draw<span class="text-brand">Mart</span></span
      >
      <!-- <span class="h-1.5 w-28 overflow-hidden rounded-full bg-sunken motion-reduce:hidden">
        <span class="block h-full w-1/3 rounded-full bg-ticket animate-progress"></span>
      </span> -->
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
